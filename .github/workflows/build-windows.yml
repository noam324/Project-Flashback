name: Project Flashback - Windows Setup

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Project Flashback Setup.exe
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Flashback.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Flashback.Web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build NSIS Setup.exe
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: Flashback.Web
          args: --bundles nsis

      - name: Prepare installer artifact
        shell: pwsh
        run: |
          $installerDirectory = "src-tauri/target/release/bundle/nsis"

          $installer = Get-ChildItem `
            -Path $installerDirectory `
            -Filter "*-setup.exe" `
            -File |
            Select-Object -First 1

          if (-not $installer) {
            throw "Project Flashback Setup.exe was not found."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "artifacts" |
            Out-Null

          $outputInstaller = `
            Join-Path `
            "artifacts" `
            "Project-Flashback-Setup.exe"

          Copy-Item `
            -Path $installer.FullName `
            -Destination $outputInstaller `
            -Force

          $hash = (
            Get-FileHash `
              -Path $outputInstaller `
              -Algorithm SHA256
          ).Hash

          "$hash  Project-Flashback-Setup.exe" |
            Set-Content `
              -Path "artifacts/Project-Flashback-Setup.exe.sha256" `
              -Encoding ascii

          Write-Host ""
          Write-Host "Installer:"
          Write-Host $outputInstaller
          Write-Host ""

          Write-Host "SHA256:"
          Write-Host $hash

      - name: Upload Project Flashback Setup
        uses: actions/upload-artifact@v4
        with:
          name: Project-Flashback-Windows-Setup
          path: |
            Flashback.Web/artifacts/Project-Flashback-Setup.exe
            Flashback.Web/artifacts/Project-Flashback-Setup.exe.sha256
          if-no-files-found: error
name: Project Flashback - Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Flashback.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Flashback.Web/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: Flashback.Web
          args: --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ProjectFlashback-Windows
          path: Flashback.Web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
